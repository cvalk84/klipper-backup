#################################################
# Toolhead Center
#################################################
 [gcode_macro TOOLHEAD_CENTER]
 gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28                           ; home if not already homed
    {% endif %}
    SAVE_GCODE_STATE NAME=PARKBED
    G90                                ; absolute positioning
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y/2} Z15 F6000                                     
    RESTORE_GCODE_STATE NAME=PARKBED
 #gcode:
    #G90
    #G1 Z10 F600
    #G1 X165 Y165 F4000    

#################################################

#################################################
# Value transfer for Macro G29 (1)
#################################################
[gcode_macro G31]
gcode:
    SET_GCODE_VARIABLE MACRO=G29 VARIABLE=k VALUE=1

#################################################
# Value transfer for Macro G29 (0)
#################################################
[gcode_macro G32]
gcode:
    SET_GCODE_VARIABLE MACRO=G29 VARIABLE=k VALUE=0

#################################################
# Bedmesh-Calibration  KAMP
#################################################
[gcode_macro G29]
variable_k:1
gcode:
    {% if k|int==1 %}
        BED_MESH_CLEAR       
        BED_MESH_CALIBRATE PROFILE=kamp  
    {% endif %}

#################################################
# Calibration
#################################################
[gcode_macro M4029]
gcode:
    BED_MESH_CLEAR
    G91 
    G1 Z10 F600
    G90
    G28
    G1 X{printer.toolhead.axis_maximum.x/2 - printer.probe["x_offset"]} Y{printer.toolhead.axis_maximum.y/2 - printer.probe["y_offset"]} F7800
    G1 Z15 F600
    ABORT
    PROBE_CALIBRATE
    ABORT
    G0 Z0

#################################################
# System Status
#################################################
 [gcode_macro SYSTEM_STATUS]
 gcode:
    RUN_SHELL_COMMAND CMD=SYSTEM_INFO

#################################################
# Cartogrspher Manual Z Calibrate
#################################################
 [gcode_macro CART_CALIBRATE]
 gcode:
    G90
    G1 Z10 F600
    G1 X165 Y165 F4000
    M190 S60
    G1 Z2 F600
    BEEP I=2 DUR=500 
    G4 P5000
    G1 Z0 F600
    BEEP I=2 DUR=500   
    G4 P10000
    G1 Z10 F600
    CARTOGRAPHER_SCAN_CALIBRATE


# Bed Leveling
#################################################
[gcode_macro LEVELING_SCREW]
description: Executes the homing of all axes and starts Screws Tilt Calculate
gcode:								   
    G28
    SCREWS_TILT_CALCULATE
    
[gcode_macro BED_MESH_CALIBRATE_AT_TEMP]																			 
gcode:
    M140 S60    
    M190 S60    
																		 
   BED_MESH_CLEAR
   G28
   BED_MESH_CALIBRATE PROFILE="default"   
   M140 S0     
   G1 X162 Y162 F6000  
   SAVE_CONFIG

[gcode_macro disable_X_Y_bed_screw_adjust]
description: Disable X/Y motors to adjust screws on bed for flatness
gcode:
  SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
  SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=0
  SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=0

[screws_tilt_adjust]
horizontal_move_z: 4
screw_thread: CCW-M4
speed: 300

screw1: 7,37
screw1_name: front left
screw2: 262,37
screw2_name: front right
screw3: 262,297
screw3_name: rear right
screw4: 7,297
screw4_name: rear left

#################################################
# Force Move
#################################################
[force_move]
enable_force_move : True

[gcode_macro FAKE_POSITION]
description: Set arbirtary position to enable uhhomed toolhead movement
gcode:
        SET_KINEMATIC_POSITION X=10 Y=10 Z=10

#################################################
# Deactivate stepper motors
#################################################
[gcode_macro M84]										   
rename_existing:M84.1
gcode:
	SET_STEPPER_ENABLE STEPPER=stepper_x enable=0
	SET_STEPPER_ENABLE STEPPER=stepper_y enable=0
	SET_STEPPER_ENABLE STEPPER=stepper_z enable=0
	SET_STEPPER_ENABLE STEPPER=extruder enable=0

