#################################################
# Includes
#################################################

[include mainsail.cfg]
[include macros/macros.cfg]
[include macros/print_start_end.cfg]
[include macros/adaptive_mesh.cfg]
[include macros/speed_test.cfg]
[include macros/calibrate_flow.cfg]
[include macros/calibrate_pa.cfg]
[include macros/shell_command.cfg]
[include macros/client.cfg]
[include timelapse.cfg]

#################################################
# Misc. Settings
#################################################

[virtual_sdcard]
path: /home/mks/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[exclude_object]

#[endstop_phase]
#[endstop_phase stepper_x]
#[endstop_phase stepper_y]

[respond]
default_type: echo

[gcode_arcs]
resolution: 0.7

[save_variables]
filename: ~/printer_data/config/saved_variables.cfg

#[printer]
#max_accel: 7000

#################################################
# Cartographer Probe settings
#################################################

[cartographer]
mcu: cartographer
x_offset: 0
y_offset: 31.6
verbose: yes
lift_speed: 5.0

[safe_z_home]
home_xy_position: 162.5,162.5
speed: 65.0 
z_hop: 10
z_hop_speed: 20.0

#################################################
# MCU Settings
#################################################

[printer]
kinematics:corexy
max_velocity: 600
max_accel: 20000
minimum_cruise_ratio: 0.5
max_z_velocity: 20
max_z_accel: 500
square_corner_velocity: 8

[mcu]
serial: /dev/ttyS0
restart_method: command

[mcu EBB]
canbus_uuid: 927b8b8a87f3

[mcu cartographer]
canbus_uuid: 81b5b034f0fb

#################################################
# Orbiter 2.5 Extruder
#################################################

[extruder]
step_pin: EBB:PD3
dir_pin: EBB:PD2
enable_pin: !EBB:PB6
rotation_distance: 4.69 #4.637 #22.6789511 
#gear_ratio: 7.5:1 #50:10
microsteps: 32
full_steps_per_rotation: 200
max_extrude_only_distance: 500.0
max_extrude_only_velocity: 120.0
#max_extrude_only_accel: 800
#min_extrude_temp: 170 #0
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBB:PB0
sensor_type: PT1000
sensor_pin: EBB:PA1
pullup_resistor: 2200          
#control: pid
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
min_temp: 0
max_temp: 250
pressure_advance: 0.025 #0.015 #calibrate
pressure_advance_smooth_time: 0.03 #calibrate
#smooth_time: 2.0
step_pulse_duration: 0.000000100

[tmc2209 extruder]
uart_pin: EBB:PB3
run_current: 0.650
stealthchop_threshold: 0 #0 for spreadCycle; 999999 for stealthCop
interpolate: False
driver_TBL: 0
driver_HEND: 6
driver_HSTRT: 7
driver_TOFF: 4

#################################################
# X, Y, Z stepper motors / Driver settings
#################################################

[stepper_x]
step_pin: PB4
dir_pin: PB3
enable_pin: !PB5
microsteps: 32
rotation_distance: 39.94
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: -7
position_endstop: -7
position_max: 325
homing_speed: 70
homing_retract_dist: 5
homing_positive_dir: False
step_pulse_duration: 0.000002

[tmc2209 stepper_x]
uart_pin: PD2
run_current: 1.07
interpolate: True
stealthchop_threshold: 0
diag_pin: ^PB8
#driver_SGTHRS: 105

#################################################												 

[stepper_y]
step_pin: PC14
dir_pin: PC13
enable_pin: !PC15
microsteps: 32
rotation_distance: 39.94
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_min: -10.5
position_endstop: -10.5
position_max: 325
homing_speed: 60
homing_retract_dist: 0
homing_positive_dir: False
step_pulse_duration: 0.000002

[tmc2209 stepper_y]
uart_pin: PB9
run_current: 1.07
interpolate: True
stealthchop_threshold: 0
diag_pin: ^PC0
#driver_SGTHRS: 125

#################################################												 

[stepper_z]
step_pin: PC10
dir_pin: PA15
enable_pin: !PC11
microsteps: 32
rotation_distance: 8
full_steps_per_rotation: 200
endstop_pin: probe:z_virtual_endstop
position_max: 315
position_min: -0.5
homing_speed: 10
homing_retract_dist: 0
second_homing_speed: 8
homing_positive_dir: false
step_pulse_duration: 0.000002

[tmc2209 stepper_z]
uart_pin: PC5
run_current: 0.95
interpolate: True
stealthchop_threshold: 0 

#################################################
# TMC Autotune
#################################################

[autotune_tmc stepper_x]
motor: qidi-BJ42D29-28V07
sg4_thrs: 90

[autotune_tmc stepper_y]
motor: qidi-BJ42D29-28V07
sg4_thrs: 155

[autotune_tmc stepper_z]
motor: qidi-BJ42D29-22V08

#################################################
# Temperature sensors
#################################################

[temperature_sensor Mainboard]
sensor_type: temperature_host
min_temp: 5
max_temp: 80

[temperature_sensor STM32F402]
sensor_type: temperature_mcu

[temperature_sensor EBB42]
sensor_type: Generic 3950
sensor_pin: EBB:PA0
pullup_resistor: 2200

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 105

#################################################
# Fans
#################################################

# Auxiliary Fan
[fan_generic auxiliary_cooling_fan]
pin: PA8
shutdown_speed: 0.0
cycle_time: 0.100
hardware_pwm: false
kick_start_time: 0.100
off_below: 0.15

# Chamber Exhaust Fan
[fan_generic chamber_exhaust_fan]
pin: PC9
shutdown_speed: 0.0
cycle_time: 0.100
hardware_pwm: false
kick_start_time: 0.100
off_below: 0.0

# Mainboard Fans				
[fan_generic mainboard_fan_l]
pin: PA4
max_power: 1.0
kick_start_time: 0.5
off_below: 0.15

[fan_generic mainboard_fan_r]
pin:PC4
max_power: 1.0
kick_start_time: 0.5
off_below: 0.15

#Part Cooling Fan
[fan]
pin: EBB:PB8

#Hotend Fan
[heater_fan hotend_fan]
pin: EBB:PB4
heater: extruder
hardware_pwm: false
heater_temp: 50.0

#################################################
# Heated bed
#################################################

[heater_bed]
heater_pin: PC8
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PA0
max_power: 1.0
#control: pid
#pid_kp: 71.039
#pid_ki: 2.223
#pid_kd: 567.421
min_temp: -100
max_temp: 125

[verify_heater heater_bed]
max_error: 200
check_gain_time: 60
hysteresis: 5
heating_gain: 1						  
                 
#################################################
# Chamber heating
#################################################

[heater_generic chamber]
heater_pin: PB10
max_power: 1.0
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PA1
control: watermark
max_delta: 1.0
#pid_Kp: 63.418 
#pid_Ki: 1.342 
#pid_Kd: 749.125
min_temp: -100
max_temp: 65

[verify_heater chamber]
max_error: 300
check_gain_time: 480
hysteresis: 5
heating_gain: 1

#################################################
# Idle Timeout
#################################################

[idle_timeout]
timeout:900
gcode:
    M104 S0 
    M140 S0 
    M84 
    SET_FAN_SPEED FAN=mainboard_fan_r SPEED=0.28
    SET_FAN_SPEED FAN=mainboard_fan_l SPEED=0.28

#################################################
# LEDs / Beep
#################################################

[output_pin caselight]
pin: PC7
pwm: false
shutdown_value: 0
value: 1

[output_pin beeper]
pin: PA2
pwm: false
shutdown_value: 0
value: 0

[output_pin sound]
pin: PA13
value: 1	
       
#################################################												 
# Power outage shutdown								 
#################################################	

[output_pin pwc]
pin: PA3
pwm: False
value: 1
shutdown_value: 1 

#################################################
# Filament sensor
#################################################

[filament_switch_sensor fila]
pause_on_runout: True
runout_gcode:
	M117 Filament Runout
    PAUSE
	SET_FILAMENT_SENSOR SENSOR=fila ENABLE=1
event_delay: 3.0
pause_delay: 0.5
switch_pin: !PC1

#################################################
#  Bed mesh
#################################################

[bed_mesh]
zero_reference_position: 162.5, 162.5   
speed: 300
horizontal_move_z: 5
mesh_min: 60,50
mesh_max: 220,220
probe_count: 20, 20
mesh_pps: 2, 2
bicubic_tension: 0.2
algorithm: bicubic
adaptive_margin: 10

#################################################
# Input Shaping
#################################################

[lis2dw]
cs_pin: EBB:PB1
spi_bus:spi2_PB2_PB11_PB10
axes_map: x,y,z

[adxl345]
cs_pin: cartographer:PA0
spi_bus: spi1

[resonance_tester]
accel_chip: adxl345
probe_points:
    162.5, 162.5, 20

